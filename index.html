<!DOCTYPE html>
<html>
<body>
    <h2>Terminal: FOST</h2>
    <table>
        <tr>
            <th>Start Time (HH:MM)</th>
            <th>Rate</th>
            <th>Batch</th>
            <th>End Time</th>
        </tr>
        <tr>
            <td><input type="text" id="start-1" oninput="runCalc(1)" placeholder="08:00"></td>
            <td><input type="number" id="rate-1" oninput="runCalc(1)" placeholder="100"></td>
            <td><input type="number" id="batch-1" oninput="runCalc(1)" placeholder="500"></td>
            <td id="end-1">-</td>
        </tr>
    </table>

    <script>
        function runCalc(row) {
            // 1. Get elements
            const startInput = document.getElementById(`start-${row}`).value;
            const rate = parseFloat(document.getElementById(`rate-${row}`).value);
            const batch = parseFloat(document.getElementById(`batch-${row}`).value);
            const endCell = document.getElementById(`end-${row}`);

            console.log(`Inputs: Start=${startInput}, Rate=${rate}, Batch=${batch}`);

            // 2. Validate
            if (!startInput.includes(':') || isNaN(rate) || isNaN(batch) || rate <= 0) {
                endCell.innerText = "Waiting...";
                return;
            }

            // 3. Logic: Total Minutes Calculation
            const parts = startInput.split(':');
            const h = parseInt(parts[0]);
            const m = parseInt(parts[1]);
            
            const startTotalMins = (h * 60) + m;
            const durationMins = batch / rate;
            const endTotalMins = startTotalMins + durationMins;

            // 4. Format Output
            const endH = Math.floor(endTotalMins / 60) % 24;
            const endM = Math.round(endTotalMins % 60);
            
            const result = String(endH).padStart(2, '0') + ":" + String(endM).padStart(2, '0');
            endCell.innerText = result;
            console.log(`Result: ${result}`);
        }
    </script>
</body>
</html>
