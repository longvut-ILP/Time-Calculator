<!DOCTYPE html>
<html>
<head>
    <style>
        :root {
            --et-blue: #003366;
            --et-light-blue: #e6f0fa;
            --et-accent: #0056b3;
            --text-dark: #333;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 40px; 
            background-color: #f4f7f9;
        }

        .header { display: flex; align-items: center; margin-bottom: 30px; border-bottom: 3px solid var(--et-blue); }
        .logo-placeholder { font-size: 24px; font-weight: bold; color: var(--et-blue); margin-right: 20px; }
        
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; }
        .reset-btn { 
            background-color: #d9534f; color: white; border: none; padding: 5px 15px; 
            border-radius: 4px; cursor: pointer; font-size: 12px;
        }
        .reset-btn:hover { background-color: #c9302c; }

        table { 
            width: 100%; border-collapse: collapse; background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden;
        }
        th { background-color: var(--et-blue); color: white; padding: 12px; }
        td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        tr:nth-child(even) { background-color: var(--et-light-blue); }

        input { width: 85%; padding: 5px; border: 1px solid #ccc; border-radius: 4px; text-align: center; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-placeholder">ENERGY TRANSFER</div>
        <h2>Terminal Operations Calculator</h2>
    </div>

    <div id="calculator-container"></div>

    <script>
        function calculateRow(inputElement) {
            const row = inputElement.closest('tr');
            const startVal = row.querySelector('.st').value;
            const rate = parseFloat(row.querySelector('.rt').value);
            const batch = parseFloat(row.querySelector('.bt').value);
            
            const durCell = row.querySelector('.dur');
            const endCell = row.querySelector('.et');

            if (startVal.includes(':') && !isNaN(rate) && !isNaN(batch) && rate > 0) {
                const [h, m] = startVal.split(':').map(Number);
                const durationHours = batch / rate;
                
                durCell.innerText = durationHours.toFixed(2);
                const totalMins = (h * 60) + m + (durationHours * 60);
                const endH = Math.floor(totalMins / 60) % 24;
                const endM = Math.round(totalMins % 60);
                
                const endStr = String(endH).padStart(2, '0') + ":" + String(endM).padStart(2, '0');
                endCell.innerText = endStr;

                const nextRow = row.nextElementSibling;
                if (nextRow) {
                    const nextStartInput = nextRow.querySelector('.st');
                    nextStartInput.value = endStr;
                    calculateRow(nextStartInput);
                }
            }
        }

        function resetTable(button) {
            const container = button.parentElement.nextElementSibling;
            const inputs = container.querySelectorAll('input');
            const cells = container.querySelectorAll('.dur, .et');
            
            inputs.forEach(input => input.value = '');
            cells.forEach(cell => cell.innerText = '-');
        }

        const container = document.getElementById('calculator-container');
        ['FOST', 'MGD1', 'MGD2', 'MGDR3'].forEach(term => {
            container.innerHTML += `
                <div class="table-header">
                    <h3>${term} Terminal</h3>
                    <button class="reset-btn" onclick="resetTable(this)">Reset Table</button>
                </div>
                <table>
                    <tr><th>Start Time</th><th>Rate (Bph)</th><th>Batch (Bbl)</th><th>Duration (Hr)</th><th>End Time</th></tr>
                    ${Array.from({length: 10}, () => `<tr>
                        <td><input type="text" class="st" oninput="calculateRow(this)" placeholder="HH:MM"></td>
                        <td><input type="number" class="rt" oninput="calculateRow(this)" placeholder="0"></td>
                        <td><input type="number" class="bt" oninput="calculateRow(this)" placeholder="0"></td>
                        <td class="dur">-</td>
                        <td class="et">-</td>
                    </tr>`).join('')}
                </table>`;
        });
    </script>
</body>
</html>
