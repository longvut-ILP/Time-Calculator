<!DOCTYPE html>
<html>
<head>
    <style>
        table { border-collapse: collapse; margin: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
        input { width: 100%; padding: 5px; box-sizing: border-box; }
    </style>
</head>
<body>
    <h2>Terminal: FOST</h2>
    <table>
        <tr>
            <th>Start Time (HH:MM)</th>
            <th>Rate</th>
            <th>Batch</th>
            <th>End Time</th>
        </tr>
        <tr>
            <td><input type="text" id="start-1" oninput="runCalc(1)" placeholder="08:00"></td>
            <td><input type="number" id="rate-1" oninput="runCalc(1)" placeholder="100"></td>
            <td><input type="number" id="batch-1" oninput="runCalc(1)" placeholder="500"></td>
            <td id="end-1">-</td>
        </tr>
        <tr>
            <td><input type="text" id="start-2" oninput="runCalc(2)" placeholder="08:00"></td>
            <td><input type="number" id="rate-2" oninput="runCalc(2)" placeholder="100"></td>
            <td><input type="number" id="batch-2" oninput="runCalc(2)" placeholder="500"></td>
            <td id="end-2">-</td>
        </tr>
        <tr>
            <td><input type="text" id="start-3" oninput="runCalc(3)" placeholder="08:00"></td>
            <td><input type="number" id="rate-3" oninput="runCalc(3)" placeholder="100"></td>
            <td><input type="number" id="batch-3" oninput="runCalc(3)" placeholder="500"></td>
            <td id="end-3">-</td>
        </tr>
    </table>

    <script>
        function runCalc(row) {
            // 1. Get elements
            const startInput = document.getElementById(`start-${row}`).value;
            const rate = parseFloat(document.getElementById(`rate-${row}`).value);
            const batch = parseFloat(document.getElementById(`batch-${row}`).value);
            const endCell = document.getElementById(`end-${row}`);

            console.log(`Inputs: Start=${startInput}, Rate=${rate}, Batch=${batch}`);

            // 2. Validate - only calculate if ALL fields are filled and valid
            if (!startInput || !startInput.includes(':') || isNaN(rate) || isNaN(batch) || rate <= 0 || batch <= 0) {
                endCell.innerText = "-";
                return;
            }

            // 3. Logic: Total Minutes Calculation
            const parts = startInput.split(':');
            const h = parseInt(parts[0]);
            const m = parseInt(parts[1]);
            
            if (isNaN(h) || isNaN(m)) {
                endCell.innerText = "-";
                return;
            }

            const startTotalMins = (h * 60) + m;
            const durationMins = batch / rate;
            const endTotalMins = startTotalMins + durationMins;

            // 4. Format Output
            const endH = Math.floor(endTotalMins / 60) % 24;
            const endM = Math.round(endTotalMins % 60);
            
            const result = String(endH).padStart(2, '0') + ":" + String(endM).padStart(2, '0');
            endCell.innerText = result;
            console.log(`Result: ${result}`);
        }
    </script>
</body>
</html>
